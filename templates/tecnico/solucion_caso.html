<!DOCTYPE html>
<html lang="es" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GITA - Registrar Diagnóstico (Técnico)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        *:focus-visible { outline: 2px solid #D97706; outline-offset: 2px; }
        
        #sidebar { transition: transform 0.3s ease-in-out; }
        .rotar-180 { transform: rotate(180deg); }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-thumb { background-color: #a3a3a3; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#303338] text-gray-200 h-screen flex flex-col md:flex-row overflow-hidden relative">

    <!-- CABECERA MÓVIL -->
    <header class="md:hidden flex items-center justify-between bg-[#2a2d31] p-4 shadow-md z-40 relative">
        <button id="menuToggleMobile" class="text-white p-2 min-h-[44px] min-w-[44px] focus-visible:ring-2 focus-visible:ring-orange-500 rounded" aria-expanded="false" aria-controls="sidebar" aria-label="Abrir menú de navegación">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <h1 class="text-xl font-bold">GITA System</h1>
        <div class="w-10 h-10 bg-gray-500 rounded-full flex items-center justify-center">👤</div>
    </header>

    <!-- SIDEBAR / MENÚ LATERAL (Rol Técnico) -->
    <aside id="sidebar" class="absolute md:relative z-50 w-64 md:w-72 h-full bg-[#303338] border-r border-gray-600 flex flex-col transform -translate-x-full md:translate-x-0">
        <div class="md:hidden p-4 flex justify-end border-b border-gray-600">
            <button id="closeSidebar" class="text-gray-400 hover:text-white p-2 min-h-[44px] min-w-[44px]" aria-label="Cerrar menú">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <nav class="flex-1 p-6 overflow-visible">
            <div class="relative w-full" id="wrapperDesplegable">
                <button id="btnMenuPrincipal" aria-expanded="false" aria-controls="contenedorListas" class="w-full flex items-center justify-between bg-[#d9d9d9] text-gray-900 font-bold px-4 py-3 rounded min-h-[44px] hover:bg-gray-300 transition-colors focus:ring-2 focus:ring-orange-500 shadow-md">
                    <div class="flex items-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                        Menú Principal
                    </div>
                    <svg id="iconoDesplegable" class="w-5 h-5 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>

                <!-- Menú Técnico -->
                <div id="contenedorListas" class="hidden absolute top-full mt-2 left-0 w-full z-50 bg-[#404348] border border-gray-600 rounded-md shadow-2xl p-3 flex-col gap-3 animate-fade-in">
                    <div id="menu-tecnico" class="menu-group flex flex-col gap-2">
                        <a href="#" class="bg-[#b3b3b3] text-gray-900 font-semibold px-4 py-2 rounded text-center min-h-[44px] flex items-center justify-center hover:bg-gray-300 border-2 border-orange-500 shadow-sm" aria-current="page">Tickets asignados (Activo)</a>
                        <a href="#" class="bg-[#b3b3b3] text-gray-900 font-semibold px-4 py-2 rounded text-center min-h-[44px] flex items-center justify-center hover:bg-gray-300 transition-colors shadow-sm">Nuevo Reporte</a>
                        <a href="#" class="bg-[#b3b3b3] text-gray-900 font-semibold px-4 py-2 rounded text-center min-h-[44px] flex items-center justify-center hover:bg-gray-300 transition-colors shadow-sm">Histórico</a>
                        <a href="#" class="bg-[#b3b3b3] text-gray-900 font-semibold px-4 py-2 rounded text-center min-h-[44px] flex items-center justify-center hover:bg-gray-300 transition-colors shadow-sm">Mis datos</a>
                        <a href="#" class="bg-[#b3b3b3] text-gray-900 font-semibold px-4 py-2 rounded text-center min-h-[44px] flex items-center justify-center hover:bg-gray-300 transition-colors shadow-sm">Mis Equipos</a>
                    </div>
                </div>
            </div>
        </nav>
    </aside>

    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden md:hidden"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 flex flex-col h-full overflow-y-auto w-full relative pb-8">
        
        <header class="hidden md:grid grid-cols-3 items-center p-6 bg-[#2a2d31]/40 border-b border-gray-700/50">
            <div>
                <!-- Botón Volver -->
                <button class="flex items-center gap-2 text-gray-400 hover:text-white transition-colors focus:outline-none focus:ring-2 focus:ring-orange-500 rounded p-1 min-h-[44px]">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    <span>Volver</span>
                </button>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wider text-center">GITA - Gestor de Incidencias TI</h1>
            <div class="flex justify-end">
                <div class="flex items-center gap-3 bg-[#404348] px-4 py-2 rounded-full shadow-md">
                    <div class="w-10 h-10 bg-gray-300 text-gray-800 rounded-full flex items-center justify-center font-bold">👤</div>
                    <span class="text-lg font-medium">Técnico</span>
                </div>
            </div>
        </header>

        <div class="flex-1 p-4 md:p-8 flex flex-col max-w-5xl mx-auto w-full gap-6">
            
            <!-- Etiqueta del Ticket -->
            <div class="bg-[#e6e6e6] text-gray-900 px-6 py-2 rounded-full font-bold text-lg md:text-xl inline-flex items-center shadow-md w-max">
                TKXXX - Falla Equipo PC
            </div>

            <!-- FORMULARIO DE SOLUCIÓN -->
            <form id="formResolucion" action="#" method="POST" enctype="multipart/form-data" class="flex flex-col flex-1 h-full mt-4">
                
                <!-- GRID RESPONSIVO (2 Columnas Área Texto / 1 Columna Evidencia) -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 lg:gap-12 flex-1">
                    
                    <!-- ÁREA DE TEXTO (Solución) -->
                    <div class="lg:col-span-2 flex flex-col h-full">
                        <label for="solucion_caso" class="text-white font-medium mb-3 text-lg">Solución del caso</label>
                        <!-- Accesibilidad: El atributo required impide envío vacío -->
                        <textarea id="solucion_caso" name="solucion" required aria-required="true"
                            class="bg-[#e6e6e6] text-gray-900 rounded-xl p-5 shadow-lg flex-1 min-h-[250px] resize-y focus:ring-2 focus:ring-orange-500 focus:outline-none font-medium text-sm md:text-base placeholder-gray-500" 
                            placeholder="Describa de forma detallada la solución aplicada..."></textarea>
                        
                        <!-- Mensaje de error dinámico (Oculto por defecto) -->
                        <p id="errorTexto" class="text-red-500 text-sm font-bold mt-2 hidden" role="alert">⚠ La descripción de la solución no puede estar vacía.</p>
                    </div>

                    <!-- ÁREA DE EVIDENCIAS -->
                    <div class="lg:col-span-1 flex flex-col justify-center gap-8 mt-4 lg:mt-0">
                        
                        <!-- Evidencia del Usuario -->
                        <div class="flex items-center justify-between gap-4 pl-2 pr-4 md:pr-0 border-b border-gray-600/50 pb-6 lg:border-none lg:pb-0">
                            <span class="text-white text-lg font-medium">Evidencia del usuario</span>
                            
                            <!-- Botón Descargar (Accesibilidad: aria-label y 44x44px) -->
                            <a href="#" download aria-label="Descargar evidencia del usuario" class="flex items-center justify-center min-h-[44px] min-w-[44px] text-[#d47c35] hover:text-[#b86729] focus:outline-none focus:ring-2 focus:ring-white rounded transition-transform hover:scale-110">
                                <svg class="w-9 h-9" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                </svg>
                            </a>
                        </div>

                        <!-- Subir Evidencia Técnica -->
                        <div class="flex flex-col gap-2 pl-2 pr-4 md:pr-0">
                            <div class="flex items-center justify-between gap-4">
                                <span class="text-white text-lg font-medium">Subir evidencia técnica</span>
                                
                                <!-- Botón Subir (Accesibilidad: Label enlazado al input invisible) -->
                                <label for="evidencia_tecnico" aria-label="Subir evidencia técnica" class="flex items-center justify-center min-h-[44px] min-w-[44px] text-[#d47c35] hover:text-[#b86729] focus-within:ring-2 focus-within:ring-white rounded transition-transform hover:scale-110 cursor-pointer">
                                    <svg class="w-9 h-9" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                                    </svg>
                                    <input type="file" id="evidencia_tecnico" name="evidencia_tecnica" class="sr-only" accept=".jpg,.png,.jpeg,.pdf">
                                </label>
                            </div>
                            <!-- Feedback visual del archivo seleccionado -->
                            <div id="nombre_archivo" class="text-sm font-medium text-[#d47c35] text-right min-h-[20px] truncate"></div>
                        </div>

                    </div>
                </div>

                <!-- PREVENCIÓN DE ERRORES CRÍTICOS: Botones separados físicamente -->
                <div class="flex justify-center gap-12 mt-12 mb-4">
                    <button type="button" class="bg-[#d47c35] text-gray-900 font-bold px-8 py-2.5 rounded-md min-h-[44px] w-36 hover:bg-[#b86729] focus:ring-2 focus:ring-white transition-colors shadow-md">
                        Cancelar
                    </button>
                    <button type="submit" class="bg-[#d47c35] text-gray-900 font-bold px-8 py-2.5 rounded-md min-h-[44px] w-36 hover:bg-[#b86729] focus:ring-2 focus:ring-white transition-colors shadow-md">
                        Guardar
                    </button>
                </div>

            </form>
        </div>
    </main>

    <!-- Script de Interactividad -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            /* === MANEJO DE EVIDENCIA TÉCNICA === */
            const fileInputTecnico = document.getElementById('evidencia_tecnico');
            const fileNameDisplay = document.getElementById('nombre_archivo');

            fileInputTecnico.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    fileNameDisplay.textContent = '📎 ' + e.target.files[0].name;
                    fileNameDisplay.classList.add('animate-fade-in');
                } else {
                    fileNameDisplay.textContent = '';
                }
            });

            /* === VALIDACIÓN ADICIONAL DE FORMULARIO === */
            const formResolucion = document.getElementById('formResolucion');
            const textareaSolucion = document.getElementById('solucion_caso');
            const errorTexto = document.getElementById('errorTexto');

            formResolucion.addEventListener('submit', (e) => {
                // Validación para asegurar que el textarea no contenga solo espacios en blanco
                if (textareaSolucion.value.trim() === '') {
                    e.preventDefault(); // Detiene el envío
                    errorTexto.classList.remove('hidden');
                    textareaSolucion.classList.add('ring-2', 'ring-red-500');
                    textareaSolucion.focus();
                } else {
                    errorTexto.classList.add('hidden');
                    textareaSolucion.classList.remove('ring-2', 'ring-red-500');
                    // e.preventDefault(); // (Descomentar para probar sin recargar la página)
                }
            });

            /* === DROPDOWNS Y SIDEBAR GENERAL === */
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const toggleMobile = document.getElementById('menuToggleMobile');
            const btnMenuPrincipal = document.getElementById('btnMenuPrincipal');
            const contenedorListas = document.getElementById('contenedorListas');
            const iconoDesplegable = document.getElementById('iconoDesplegable');
            const wrapperDesplegable = document.getElementById('wrapperDesplegable');

            btnMenuPrincipal.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                if(contenedorListas.classList.contains('hidden')) { 
                    contenedorListas.classList.remove('hidden'); 
                    contenedorListas.classList.add('flex'); 
                    iconoDesplegable.classList.add('rotar-180'); 
                    btnMenuPrincipal.setAttribute('aria-expanded', 'true'); 
                } else { 
                    cerrarMenuLateral();
                } 
            });

            function cerrarMenuLateral() {
                contenedorListas.classList.add('hidden'); 
                contenedorListas.classList.remove('flex'); 
                iconoDesplegable.classList.remove('rotar-180'); 
                btnMenuPrincipal.setAttribute('aria-expanded', 'false');
            }

            document.addEventListener('click', (e) => { 
                if (wrapperDesplegable && !wrapperDesplegable.contains(e.target) && !contenedorListas.classList.contains('hidden')) { 
                    cerrarMenuLateral();
                } 
            });
            
            function toggleSidebar() { 
                sidebar.classList.toggle('-translate-x-full'); 
                overlay.classList.toggle('hidden'); 
            }
            toggleMobile.addEventListener('click', toggleSidebar);
            document.getElementById('closeSidebar').addEventListener('click', toggleSidebar);
            overlay.addEventListener('click', toggleSidebar);
        });
    </script>
</body>
</html>
