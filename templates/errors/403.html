{% load static %}
<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Acceso Denegado | GITA System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#6A6F75] to-[#303338] p-4 text-gray-200">

    <div class="bg-[#404348] border border-gray-600 rounded-xl shadow-2xl max-w-md w-full p-8 text-center transition-all">
        <!-- Icono de Candado / Alerta -->
        <div class="w-16 h-16 mx-auto mb-4 bg-red-900/40 border border-red-500/50 rounded-full flex items-center justify-center text-red-400">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m0 0v2m0-2h2m-2 0H10m4-6V7a4 4 0 00-8 0v4h8zM6 11h12a2 2 0 012 2v7a2 2 0 01-2 2H6a2 2 0 01-2-2v-7a2 2 0 012-2z" />
            </svg>
        </div>

        <h1 class="text-3xl font-bold text-white mb-2">403</h1>
        <h2 class="text-xl font-semibold text-orange-400 mb-4">Acceso Denegado</h2>

        <p class="text-gray-300 text-sm mb-6 leading-relaxed">
            {{ mensaje|default:"No posees los privilegios o el rol necesario para acceder a este módulo del sistema." }}
        </p>

        <div class="border-t border-gray-600 pt-5 flex flex-col sm:flex-row gap-3 justify-center">
            <a href="{{ ruta_retorno|default:'/login/' }}" 
               class="inline-flex items-center justify-center px-5 py-2.5 bg-[#D47C35] hover:bg-[#b86729] text-gray-900 font-semibold rounded-md shadow-md transition-colors text-sm">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Volver a mi Panel
            </a>
            <a href="{% url 'logout' %}" 
               class="inline-flex items-center justify-center px-4 py-2.5 bg-gray-700 hover:bg-gray-600 text-gray-300 font-medium rounded-md transition-colors text-sm">
                Cerrar Sesión
            </a>
        </div>
    </div>

</body>
</html>
