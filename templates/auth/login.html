{% load static %}
<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GITA – Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {font-family: 'Inter', sans-serif; overflow-x: hidden;}
        *:focus-visible {outline: 2px solid #D97706; outline-offset: 2px;}
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#6A6F75] to-[#303338] p-4">
    <main class="bg-[#404348] rounded-xl shadow-2xl w-full max-w-[343px] md:max-w-sm p-6 md:p-8 transition-all duration-300">
        <div class="flex flex-col items-center mb-6 md:mb-8">
            <svg class="w-14 h-14 md:w-16 md:h-16 text-gray-300 mb-2 drop-shadow-md transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/> 
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <h1 class="text-2xl md:text-3xl font-bold text-white tracking-wide transition-all">GITA</h1>
            <h2 class="text-lg md:text-xl font-light text-gray-300 tracking-[0.2em] -mt-1 transition-all">SYSTEM</h2>
        </div>
        <!-- The form now POSTs to the new API endpoint -->
        <form id="loginForm" class="space-y-4 md:space-y-5" autocomplete="off" novalidate>
            {% csrf_token %}
            <!-- Usuario / Identificador -->
            <div>
                <label for="identifier" class="block text-sm font-medium text-gray-200 mb-1">Usuario</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    </div>
                    <input type="text"
                           id="identifier"
                           name="identifier"
                           required
                           minlength="3"
                           maxlength="150"
                           autocomplete="username"
                           autocapitalize="none"
                           spellcheck="false"
                           aria-label="Ingrese su usuario, correo o cédula"
                           placeholder="ej. usuario01 / correo@ejemplo.com / V-12345678"
                           class="w-full h-[44px] pl-10 pr-3 bg-[#828282] text-gray-900 placeholder-gray-500 rounded-md focus:ring-2 focus:ring-orange-500 focus:bg-gray-200 transition-colors shadow-inner text-base"/>
                </div>
            </div>
            <!-- Contraseña -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-200 mb-1">Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8V7a4 4 0 00-8 0v4h8z"/></svg>
                    </div>
                    <input type="password"
                           id="password"
                           name="password"
                           required
                           minlength="8"
                           maxlength="128"
                           autocomplete="current-password"
                           aria-label="Ingrese su contraseña"
                           placeholder="********"
                           class="w-full h-[44px] pl-10 pr-10 bg-[#828282] text-gray-900 placeholder-gray-500 rounded-md focus:ring-2 focus:ring-orange-500 focus:bg-gray-200 transition-colors shadow-inner text-base"/>
                    <button type="button"
                            id="togglePassword"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-600 hover:text-gray-900 focus:outline-none min-h-[44px] min-w-[44px] justify-end"
                            aria-label="Mostrar u ocultar contraseña"
                            aria-pressed="false">
                        <svg id="eyeIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    </button>
                </div>
            </div>
            <!-- Recordarme & Olvido -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs md:text-sm text-gray-300 pt-1">
                <label class="flex items-center cursor-pointer min-h-[24px]">
                    <input type="checkbox"
                           id="remember_me"
                           name="remember_me"
                           class="h-4 w-4 rounded bg-gray-600 border-gray-500 text-orange-500 focus:ring-orange-500"
                           aria-label="Recordarme">
                    <span class="ml-2">Recordarme</span>
                </label>
                <!-- <a href="/password-reset/" id="forgotLink" class="hover:text-white hover:underline transition-colors min-h-[24px] flex items-center">Olvidé mi contraseña</a> -->
            </div>
            <!-- Botón -->
            <div class="flex justify-center pt-3 md:pt-4">
                <button type="submit"
                        id="submitBtn"
                        class="bg-[#D47C35] hover:bg-[#b86729] text-gray-900 font-semibold py-2 w-full sm:w-40 h-[44px] rounded-md shadow-md transition-colors duration-200"
                        disabled>
                    Iniciar sesión
                </button>
            </div>
            <div id="errorMsg" class="mt-4 text-center hidden">
                <p class="text-[#A53434] font-semibold text-sm drop-shadow-sm" role="alert"></p>
            </div>
        </form>
    </main>
    <script>
        // Helper: trim identifier on blur / paste
        const identifierInput = document.getElementById('identifier');
        identifierInput.addEventListener('blur', () => {
            identifierInput.value = identifierInput.value.trim();
        });
        identifierInput.addEventListener('paste', (e) => {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text');
            identifierInput.value = text.replace(/[\s\u200B]+/g, ''); // remove invisible chars & spaces
        });

        // Password visibility toggle – keep focus
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        togglePassword.addEventListener('click', (e) => {
            e.preventDefault();
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const pressed = togglePassword.getAttribute('aria-pressed') === 'true';
            togglePassword.setAttribute('aria-pressed', !pressed);
            // icon colour feedback
            if (type === 'text') {
                togglePassword.classList.add('text-orange-500');
                togglePassword.classList.remove('text-gray-600');
            } else {
                togglePassword.classList.remove('text-orange-5');
                togglePassword.classList.add('text-gray-600');
            }
        });

        // Submit handling – state machine
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorDiv = document.getElementById('errorMsg');
        const errorText = errorDiv.querySelector('p');
        // Enable button after DOM ready – idle state
        submitBtn.disabled = false;
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            // Basic front‑end validation (HTML5 already does most)
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }
            // Switch to loading state
            submitBtn.disabled = true;
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Verificando...';
            // optional spinner could be added here
            const payload = {
                identificador: identifierInput.value,
                password: passwordInput.value,
                recordarme: document.getElementById('remember_me').checked,
            };
            try {
                const resp = await fetch('{% url "api_login" %}', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
                    body: JSON.stringify(payload),
                });
                const data = await resp.json();
                if (resp.ok) {
                    // redirect según backend
                    window.location.href = data.data.redirect_url;
                } else {
                    // muestra error del backend
                    errorText.textContent = data.message || 'Error de autenticación.';
                    errorDiv.classList.remove('hidden');
                    // focus al campo que falló (simple heurística)
                    if (data.code === 'INVALID_CREDENTIALS') {
                        identifierInput.focus();
                    }
                }
            } catch (err) {
                errorText.textContent = 'Fallo de red. Por favor intente nuevamente.';
                errorDiv.classList.remove('hidden');
            } finally {
                // volver a estado idle
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });
        // Enlace olvido – pasa el identificador si existe
        const forgotLink = document.getElementById('forgotLink');
        forgotLink.addEventListener('click', (e) => {
            e.preventDefault();
            const id = encodeURIComponent(identifierInput.value.trim());
            const url = `/password-reset/${id ? '?id=' + id : ''}`;
            window.location.href = url;
        });
    </script>
</body>
</html>
