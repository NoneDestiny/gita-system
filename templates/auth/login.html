{% load static %}
<!DOCTYPE html>
<html lang="es" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - GITA SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; /* RNF-05: Previene el scroll horizontal obligatorio */
        }
        
        /* RNF-02: Focus ring explícito para navegación por teclado */
        *:focus-visible {
            outline: 2px solid #D97706;
            outline-offset: 2px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#6A6F75] to-[#303338] p-4">

    <!-- TARJETA PRINCIPAL RESPONSIVA -->
    <!-- 
      Mobile (375px): w-full max-w-[343px] p-6 (Ajuste perfecto con márgenes de 16px)
      Tablet/Desktop (md:): max-w-sm p-8 (Se expande ligeramente y aumenta el padding) 
    -->
    <main class="bg-[#404348] rounded-xl shadow-2xl w-full max-w-[343px] md:max-w-sm p-6 md:p-8 transition-all duration-300">
        
        <!-- Contenedor del Logo -->
        <div class="flex flex-col items-center mb-6 md:mb-8">
            <!-- Icono: Escala ligeramente en escritorio -->
            <svg class="w-14 h-14 md:w-16 md:h-16 text-gray-300 mb-2 drop-shadow-md transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <!-- Texto: Escala el tamaño de fuente (text-2xl a text-3xl) -->
            <h1 class="text-2xl md:text-3xl font-bold text-white tracking-wide transition-all">GITA</h1>
            <h2 class="text-lg md:text-xl font-light text-gray-300 tracking-[0.2em] -mt-1 transition-all">SYSTEM</h2>
        </div>

        <form method="POST" action="{% url 'login' %}" class="space-y-4 md:space-y-5">
            {% csrf_token %}
            
            <!-- Grupo: Usuario -->
            <div>
                <label for="username" class="block text-sm font-medium text-gray-200 mb-1">Usuario</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <!-- h-[44px]: Garantiza el área táctil mínima (Ergonomía ISO 9241-11) en cualquier dispositivo -->
                    <input type="text" id="username" name="username" required aria-label="Ingrese su usuario" placeholder="ej. usuario01" 
                           class="w-full h-[44px] pl-10 pr-3 bg-[#828282] text-gray-900 placeholder-gray-500 rounded-md focus:ring-2 focus:ring-orange-500 focus:bg-gray-200 transition-colors shadow-inner text-base" />
                </div>
            </div>

            <!-- Grupo: Contraseña -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-200 mb-1">Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <input type="password" id="password" name="password" required aria-label="Ingrese su contraseña" placeholder="••••••••••••" 
                           class="w-full h-[44px] pl-10 pr-10 bg-[#828282] text-gray-900 placeholder-gray-500 rounded-md focus:ring-2 focus:ring-orange-500 focus:bg-gray-200 transition-colors shadow-inner text-base" />
                    
                    <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-600 hover:text-gray-900 focus:outline-none min-h-[44px] min-w-[44px] justify-end" aria-label="Revelar u ocultar contraseña">
                        <svg id="eyeIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Opciones extra: Se ajusta la disposición en pantallas muy pequeñas -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs md:text-sm text-gray-300 pt-1">
                <label class="flex items-center cursor-pointer min-h-[24px]">
                    <input type="checkbox" name="remember_me" class="h-4 w-4 rounded bg-gray-600 border-gray-500 text-orange-500 focus:ring-orange-500">
                    <span class="ml-2">Recordarme</span>
                </label>
                <a href="#" class="hover:text-white hover:underline transition-colors min-h-[24px] flex items-center">Olvidé mi contraseña</a>
            </div>

            <!-- Botón de Envío -->
            <div class="flex justify-center pt-3 md:pt-4">
                <!-- w-full sm:w-40: En teléfonos pequeños ocupa el 100% del ancho, en web se reduce a 40 (160px) -->
                <button type="submit" class="bg-[#D47C35] hover:bg-[#b86729] text-gray-900 font-semibold py-2 w-full sm:w-40 h-[44px] rounded-md shadow-md transition-colors duration-200">
                    Iniciar sesión
                </button>
            </div>

            {% if form.errors or messages %}
            <div class="mt-4 text-center">
                <p class="text-[#A53434] font-semibold text-sm drop-shadow-sm" role="alert">
                    Usuario y/o contraseña invalidos
                </p>
            </div>
            {% endif %}
        </form>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                if(type === 'text') {
                    this.classList.add('text-orange-500');
                    this.classList.remove('text-gray-600');
                } else {
                    this.classList.remove('text-orange-500');
                    this.classList.add('text-gray-600');
                }
            });
        });
    </script>
</body>
</html>
